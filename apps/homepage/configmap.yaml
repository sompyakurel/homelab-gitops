apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Witch Hazel Data Centre</title>
    <style>
      :root { --ink:#e8eef7; --dim:#93a5bd; --faint:#5f728c; --stars:.85; }
      body[data-scene="night"] { --accent:#7aa2f7; --glow:rgba(122,162,247,.20);
        --bgA:#0d1526; --bgB:#0a0f1c; --bgC:#080d18; --glassA:rgba(255,255,255,.07); --glassB:rgba(255,255,255,.02);
        --border:rgba(255,255,255,.10); --fieldbg:rgba(20,33,58,.55); --clock:#c8d6ea; --facts:#c8d6ea; }
      body[data-scene="dawn"] { --accent:#f5a97f; --glow:rgba(245,169,127,.25); --ink:#f9efea; --dim:#cfa9a0; --faint:#8a6a68; --stars:.35;
        --bgA:#241722; --bgB:#1a1119; --bgC:#120b12; --glassA:rgba(255,255,255,.07); --glassB:rgba(255,255,255,.02);
        --border:rgba(255,255,255,.10); --fieldbg:rgba(46,26,40,.55); --clock:#ecd9d2; --facts:#ecd9d2; }
      body[data-scene="day"] { --accent:#0284c7; --glow:rgba(56,160,230,.20); --ink:#17263c; --dim:#4c637c; --faint:#8496ab; --stars:0;
        --bgA:#e8f1f9; --bgB:#f4f8fc; --bgC:#e2ecf6; --glassA:rgba(255,255,255,.65); --glassB:rgba(255,255,255,.35);
        --border:rgba(23,38,60,.14); --fieldbg:rgba(255,255,255,.65); --clock:#33475e; --facts:#33475e; }
      body[data-scene="dusk"] { --accent:#f0876f; --glow:rgba(240,135,111,.24); --ink:#f6ece7; --dim:#c2a49b; --faint:#7d6470; --stars:.5;
        --bgA:#1d1426; --bgB:#150f1e; --bgC:#0f0a16; --glassA:rgba(255,255,255,.07); --glassB:rgba(255,255,255,.02);
        --border:rgba(255,255,255,.10); --fieldbg:rgba(40,24,48,.55); --clock:#e8d5cc; --facts:#e8d5cc; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink);
             background: radial-gradient(120% 55% at 50% -5%, var(--glow), rgba(0,0,0,0) 60%), linear-gradient(180deg, var(--bgA) 0%, var(--bgB) 55%, var(--bgC) 100%);
             min-height:100vh; display:flex; justify-content:center; }
      body::before { content:""; position:fixed; inset:-12%; z-index:0; pointer-events:none;
        background:
          radial-gradient(38% 30% at 18% 8%, var(--glow), rgba(0,0,0,0) 70%),
          radial-gradient(34% 28% at 84% 16%, var(--glow), rgba(0,0,0,0) 70%),
          radial-gradient(30% 24% at 55% 96%, var(--glow), rgba(0,0,0,0) 70%);
        filter:blur(28px); animation:drift 26s ease-in-out infinite alternate; }
      body::after { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:var(--stars);
        transition:opacity 1.4s ease; animation:twinkle 5s ease-in-out infinite alternate;
        background-image:
          radial-gradient(1.6px 1.6px at 9% 18%, rgba(255,255,255,.95) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.2px 1.2px at 23% 64%, rgba(255,255,255,.8) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.8px 1.8px at 37% 9%, rgba(255,255,255,.9) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.2px 1.2px at 51% 38%, rgba(255,255,255,.75) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.5px 1.5px at 64% 14%, rgba(255,255,255,.9) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.2px 1.2px at 76% 52%, rgba(255,255,255,.8) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.7px 1.7px at 88% 26%, rgba(255,255,255,.95) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.2px 1.2px at 95% 70%, rgba(255,255,255,.75) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.3px 1.3px at 44% 82%, rgba(255,255,255,.8) 50%, rgba(0,0,0,0) 52%),
          radial-gradient(1.3px 1.3px at 16% 88%, rgba(255,255,255,.8) 50%, rgba(0,0,0,0) 52%); }
      @keyframes drift { from { transform:translate3d(-2.5%, -1.5%, 0) scale(1); } to { transform:translate3d(2.5%, 2%, 0) scale(1.07); } }
      @keyframes twinkle { from { opacity:calc(var(--stars) * .72); } to { opacity:var(--stars); } }
      main { max-width:1180px; width:100%; padding:36px 28px 56px; position:relative; z-index:1; }
      .greet { font-size:38px; font-weight:700; }
      .greet .accent { color:var(--accent); }
      .sub { color:var(--dim); margin-top:4px; }
      .clock { font-size:15px; color:var(--clock); margin-top:10px; letter-spacing:1px; }
      .scene { font-size:12px; color:var(--faint); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
      .cmd { margin-top:24px; display:flex; align-items:center; gap:10px; background:var(--fieldbg);
             border:1px solid var(--border); border-radius:14px; padding:12px 14px;
             backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
      .cmd svg { flex:0 0 auto; stroke:var(--dim); }
      .cmd input { flex:1; background:none; border:none; outline:none; color:var(--ink); font-size:16px; }
      .cmd input::placeholder { color:var(--faint); }
      .cmd kbd { color:var(--faint); border:1px solid var(--border); border-bottom-width:2px; border-radius:6px;
                 padding:1px 7px; font-size:12px; font-family:inherit; }
      .nomatch { display:none; color:var(--faint); font-size:14px; margin-top:14px; text-align:center; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(215px, 1fr)); gap:12px; margin-top:14px; }
      @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
      .grid > * { animation:rise .55s ease both; }
      .grid > *:nth-child(2) { animation-delay:.05s; } .grid > *:nth-child(3) { animation-delay:.1s; }
      .grid > *:nth-child(4) { animation-delay:.15s; } .grid > *:nth-child(5) { animation-delay:.2s; }
      .grid > *:nth-child(6) { animation-delay:.25s; } .grid > *:nth-child(7) { animation-delay:.3s; }
      .grid > *:nth-child(8) { animation-delay:.35s; }
      .strip .stat { animation:rise .55s ease both; }
      .lower { display:grid; grid-template-columns:1.55fr 1fr; gap:14px; margin-top:22px; align-items:start; }
      .lower .panel { margin-top:0; }
      .sidecol { display:grid; gap:14px; }
      .sidecol .panel { margin-top:0; }
      .panel svg rect.patrol { fill:none; animation:patrol 26s linear infinite; }
      @keyframes patrol { to { stroke-dashoffset:-240; } }
      @media (max-width:900px) { .lower { grid-template-columns:1fr; } }
      @media (max-width:560px) {
        main { padding:24px 14px 40px; }
        .greet { font-size:29px; }
        .grid { grid-template-columns:1fr 1fr; }
      }
      @media (prefers-reduced-motion: reduce) {
        body::before, body::after, .grid > *, .strip .stat, .panel svg rect.patrol { animation:none; }
      }
      a.door { position:relative; display:block; padding:16px; color:var(--ink); text-decoration:none; border-radius:16px;
               background:linear-gradient(160deg, var(--glassA), var(--glassB));
               border:1px solid var(--border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
               transition:border-color .2s, transform .15s; }
      a.door:hover, a.door:active { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 10px 28px var(--glow); }
      a.door .icon { width:26px; height:26px; stroke:var(--accent); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
      a.door b { font-size:17px; display:block; margin-top:9px; }
      a.door span { color:var(--dim); font-size:13px; }
      .dot { position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%;
             background:#5f728c; box-shadow:0 0 0 3px rgba(255,255,255,.05); }
      .dot.up { background:#3fb96f; box-shadow:0 0 8px rgba(63,185,111,.8); }
      .dot.down { background:#e5534b; box-shadow:0 0 8px rgba(229,83,75,.9); animation:pulse 1.6s infinite; }
      .dot.pending { background:#e8a33d; box-shadow:0 0 8px rgba(232,163,61,.8); }
      .dot.maint { background:#58a6ff; box-shadow:0 0 8px rgba(88,166,255,.8); }
      .dot.unknown { background:#5f728c; }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
      .panel { margin-top:22px; border-radius:16px; padding:16px;
               background:linear-gradient(160deg, var(--glassA), var(--glassB));
               border:1px solid var(--border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
      .panel h2 { margin:0 0 10px; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--faint); font-weight:600; }
      .panel svg text { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
      .panel svg rect { fill:var(--glassB); stroke:var(--border); }
      .panel svg rect[stroke="var(--accent)"] { stroke:var(--accent); }
      .panel svg path { stroke:var(--border); }
      .panel svg text { fill:var(--ink); }
      .panel svg text[fill="#93a5bd"] { fill:var(--dim); }
      .panel svg text[fill="#c8d6ea"] { fill:var(--clock); }
      .facts { line-height:1.9; color:var(--facts); font-size:14px; }
      .strip { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
      .stat { flex:1 1 100px; border-radius:14px; padding:10px 12px;
              background:linear-gradient(160deg, var(--glassA), var(--glassB));
              border:1px solid var(--border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
      .stat .k { font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--faint); }
      .stat .v { font-size:19px; font-weight:650; margin-top:3px; }
      .stat .s { font-size:11.5px; color:var(--dim); margin-top:1px; }
      div.tile { position:relative; display:block; padding:16px; color:var(--ink); border-radius:16px;
                 background:linear-gradient(160deg, var(--glassA), var(--glassB));
                 border:1px solid var(--border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
      div.tile .icon { width:26px; height:26px; stroke:var(--accent); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
      div.tile b { font-size:17px; display:block; margin-top:9px; }
      div.tile span { color:var(--dim); font-size:13px; display:block; }
      a.door .count { display:block; color:var(--dim); font-size:12.5px; margin-top:3px; }
      .feed { line-height:1.85; font-size:14px; color:var(--facts); }
      .feed .when { color:var(--faint); font-size:12.5px; margin-right:8px; }
      .feed .bad { color:#e5534b; }
      footer { margin-top:22px; color:var(--faint); font-size:12px; text-align:center; line-height:1.7; }
    </style>
    </head>
    <body data-scene="night">
    <main>
      <div class="greet"><span id="greet" class="accent">नमस्ते</span>, Som</div>
      <div class="sub">Witch Hazel Data Centre — Canal Winchester, Ohio</div>
      <div class="clock" id="clock"></div>
      <div class="scene" id="scene"></div>

      <div class="cmd">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="cmd" type="text" placeholder="Jump to a door — try &lsquo;photos&rsquo;" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="nomatch" id="nomatch">No door by that name in this house.</div>

      <div class="strip" id="strip" style="display:none">
        <div class="stat"><div class="k">Load</div><div class="v" id="v-load">–</div><div class="s">4 cores</div></div>
        <div class="stat"><div class="k">Memory</div><div class="v" id="v-mem">–</div><div class="s">of 16 GB</div></div>
        <div class="stat"><div class="k">Library disk</div><div class="v" id="v-lib">–</div><div class="s">photos volume</div></div>
        <div class="stat"><div class="k">Vault disk</div><div class="v" id="v-vault">–</div><div class="s">backup drive</div></div>
        <div class="stat"><div class="k">Checks</div><div class="v" id="v-checks">–</div><div class="s" id="v-updated">watchman</div></div>
      </div>

      <div class="grid" id="grid">
        <a class="door" href="https://100.120.220.32:8006" data-name="Proxmox" data-keys="proxmox pve hypervisor host virtual machines vms">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><circle cx="7.2" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="7.2" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg>
          <i class="dot unknown" data-door="proxmox" title="Checking status…"></i>
          <b>Proxmox</b><span>The hypervisor</span>
        </a>
        <a class="door" href="http://192.168.1.21:30030" data-name="Grafana" data-keys="grafana metrics prometheus charts vitals graphs">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6 21v-7"/><path d="M11 21V5"/><path d="M16 21v-10"/><path d="M21 21v-13"/></svg>
          <i class="dot unknown" data-door="grafana" title="Checking status…"></i>
          <b>Grafana</b><span>Cluster vital signs</span>
        </a>
        <a class="door" href="http://192.168.1.21:30080" data-name="Demo App" data-keys="demo app nginx workload test">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
          <b>Demo App</b><span>The first workload</span>
        </a>
        <a class="door" href="https://gharlearn.com" data-name="Ghar" data-keys="ghar nepali learn language kids school">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M10 21v-6h4v6"/></svg>
          <i class="dot unknown" data-door="ghar" title="Checking status…"></i>
          <b>Ghar</b><span>Learn Nepali</span>
        </a>
        <a class="door" href="http://192.168.1.21:30095" data-name="Status" data-keys="status uptime kuma monitors health">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6.5 4.5 13L16.5 12H21"/></svg>
          <i class="dot unknown" data-door="status" title="Checking status…"></i>
          <b>Status</b><span>Uptime Kuma's watch</span>
        </a>
        <a class="door" href="http://192.168.1.24:2283" data-name="Photos" data-keys="photos immich pictures archive family backup">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16.5 16 11.5 5 19"/></svg>
          <i class="dot unknown" data-door="photos" title="Checking status…"></i>
          <b>Photos</b><span>The family archive</span>
          <span class="count" id="photos-count"></span>
        </a>
        <a class="door" href="https://192.168.1.21:30091" data-name="ArgoCD" data-keys="argocd gitops sync deploy applications git">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <b>ArgoCD</b><span>The delivery engine</span>
        </a>
        <div class="tile">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.6"/></svg>
          <b>The Vault</b><span id="vault-line">Encrypted restic backups</span><span id="vault-sub"></span>
        </div>
      </div>

      <div class="lower">
      <div class="panel">
        <h2>The Estate</h2>
        <svg viewBox="0 0 600 356" width="100%" role="img" aria-label="Map of the Witch Hazel estate">
          <rect x="16" y="14" width="140" height="42" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
          <text x="86" y="33" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e8eef7">Internet</text>
          <text x="86" y="48" text-anchor="middle" font-size="10" fill="#93a5bd">the world</text>
          <rect x="228" y="14" width="170" height="42" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
          <text x="313" y="33" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e8eef7">AT&amp;T Gateway</text>
          <text x="313" y="48" text-anchor="middle" font-size="10" fill="#93a5bd">192.168.1.254</text>
          <a href="https://gharlearn.com">
            <rect x="444" y="14" width="140" height="42" rx="12" fill="rgba(255,255,255,.04)" stroke="var(--accent)" stroke-opacity=".45"/>
            <text x="514" y="33" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e8eef7">Ghar</text>
            <text x="514" y="48" text-anchor="middle" font-size="10" fill="#93a5bd">AWS · Fly.io</text>
          </a>
          <path d="M156 35 H228" stroke="rgba(255,255,255,.25)"/>
          <path d="M398 35 H444" stroke="rgba(255,255,255,.25)" stroke-dasharray="4 4"/>
          <path d="M313 56 V92" stroke="rgba(255,255,255,.25)"/>
          <rect x="36" y="92" width="528" height="248" rx="16" fill="rgba(255,255,255,.02)" stroke="var(--accent)" stroke-opacity=".45"/>
          <a href="https://100.120.220.32:8006">
            <text x="56" y="119" font-size="12" letter-spacing="2" fill="#e8eef7" font-weight="600">BEELINK N100 — PVE · 192.168.1.10</text>
          </a>
          <a href="http://192.168.1.21:30030">
            <rect x="56" y="132" width="286" height="118" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
            <text x="72" y="157" font-size="13" font-weight="600" fill="#e8eef7">k3s cluster — three VMs</text>
            <rect x="72" y="168" width="76" height="26" rx="8" fill="rgba(255,255,255,.06)"/>
            <text x="110" y="185" text-anchor="middle" font-size="10.5" fill="#c8d6ea">101 master</text>
            <rect x="156" y="168" width="84" height="26" rx="8" fill="rgba(255,255,255,.06)"/>
            <text x="198" y="185" text-anchor="middle" font-size="10.5" fill="#c8d6ea">102 worker1</text>
            <rect x="248" y="168" width="84" height="26" rx="8" fill="rgba(255,255,255,.06)"/>
            <text x="290" y="185" text-anchor="middle" font-size="10.5" fill="#c8d6ea">103 worker2</text>
            <text x="72" y="223" font-size="11" fill="#93a5bd">Grafana · Demo · Kuma · ArgoCD · this page</text>
          </a>
          <a href="http://192.168.1.24:2283">
            <rect x="358" y="132" width="186" height="54" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
            <text x="374" y="157" font-size="13" font-weight="600" fill="#e8eef7">CT 104 — Immich</text>
            <text x="374" y="175" font-size="10.5" fill="#93a5bd">Photos · 192.168.1.24</text>
          </a>
          <rect x="358" y="198" width="186" height="52" rx="12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)"/>
          <text x="374" y="221" font-size="13" font-weight="600" fill="#e8eef7">USB Vault</text>
          <text x="374" y="239" font-size="10.5" fill="#93a5bd">restic · nightly 03:00</text>
          <rect class="patrol" x="56" y="262" width="488" height="52" rx="12" fill="none" stroke="rgba(255,255,255,.22)" stroke-dasharray="5 5"/>
          <text x="72" y="286" font-size="13" font-weight="600" fill="#e8eef7">Night-watchman</text>
          <text x="72" y="304" font-size="10.5" fill="#93a5bd">15 checks · every 30 minutes · reports by exception only</text>
        </svg>
      </div>

      <div class="sidecol">
      <div class="panel facts">
        3 nodes Ready — master · worker1 · worker2<br>
        Kubernetes — k3s v1.37.2<br>
        Deployed by ArgoCD, from git<br>
        Photos sleep in an encrypted vault — backed up nightly at 03:00<br>
        A night-watchman walks the grounds every 30 minutes<br>
        Est. November 2026 — one N100, 16 GB of ambition
      </div>

      <div class="panel">
        <h2>Estate Feed</h2>
        <div class="feed" id="feed">The watchman has filed nothing yet.</div>
      </div>
      </div>
      </div>
      <footer>This page is a git commit.<br>If it ever breaks, ArgoCD puts it back.</footer>
    </main>
    <script>
      function tick() {
        var d = new Date(), h = d.getHours();
        var g = h < 12 ? 'शुभ प्रभात' : (h < 17 ? 'नमस्ते' : (h < 21 ? 'शुभ सन्ध्या' : 'शुभ रात्रि'));
        document.getElementById('greet').textContent = g;
        document.getElementById('clock').textContent = d.toLocaleString();
        var scene = (h >= 5 && h < 9) ? 'dawn' : (h >= 9 && h < 17) ? 'day' : (h >= 17 && h < 21) ? 'dusk' : 'night';
        if (document.body.dataset.scene !== scene) document.body.dataset.scene = scene;
        document.getElementById('scene').textContent = '· ' + scene + ' over Witch Hazel ·';
      }
      tick(); setInterval(tick, 1000);

      var cmd = document.getElementById('cmd');
      var doors = Array.prototype.slice.call(document.querySelectorAll('a.door'));
      var nomatch = document.getElementById('nomatch');
      function filterDoors() {
        var q = cmd.value.trim().toLowerCase(), shown = 0;
        doors.forEach(function (a) {
          var hay = (a.dataset.name + ' ' + (a.dataset.keys || '')).toLowerCase();
          var hit = !q || hay.indexOf(q) !== -1;
          a.style.display = hit ? '' : 'none';
          if (hit) shown++;
        });
        nomatch.style.display = shown ? 'none' : 'block';
        return shown;
      }
      cmd.addEventListener('input', filterDoors);
      cmd.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          var first = doors.filter(function (a) { return a.style.display !== 'none'; })[0];
          if (first) location.href = first.href;
        } else if (e.key === 'Escape') { cmd.value = ''; filterDoors(); cmd.blur(); }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === '/' && document.activeElement !== cmd) { e.preventDefault(); cmd.focus(); }
      });

      var DOORS = { proxmox: ['Proxmox'], grafana: ['Grafana'],
                    ghar: ['Ghar website', 'backend-patient-wave-3724.fly.dev'], photos: ['4. Photos'] };
      function norm(s) { return String(s).trim().toLowerCase(); }
      var RANK = { 0: 0, 2: 1, 3: 2, 1: 3 };
      var CLS = { 0: 'down', 1: 'up', 2: 'pending', 3: 'maint' };
      function setDot(door, cls, title) {
        var d = document.querySelector('.dot[data-door="' + door + '"]');
        if (!d) return;
        d.className = 'dot ' + cls; d.title = title;
      }
      function latestBeat(list) {
        var best = null;
        (list || []).forEach(function (b) { if (!best || b.time > best.time) best = b; });
        return best;
      }
      function lights() {
        fetch('/kuma-api/status-page/witch-hazel').then(function (r) { return r.json(); }).then(function (cfg) {
          var byName = {};
          (cfg.publicGroupList || []).forEach(function (g) {
            (g.monitorList || []).forEach(function (m) { byName[norm(m.name)] = m.id; });
          });
          return fetch('/kuma-api/status-page/heartbeat/witch-hazel').then(function (r) { return r.json(); }).then(function (hb) {
            setDot('status', 'up', 'Uptime Kuma is answering');
            Object.keys(DOORS).forEach(function (door) {
              var worst = null, worstName = '';
              DOORS[door].forEach(function (name) {
                var id = byName[norm(name)];
                if (id == null) return;
                var beat = latestBeat(hb.heartbeatList && hb.heartbeatList[id]);
                if (!beat) return;
                if (worst === null || RANK[beat.status] < RANK[worst]) { worst = beat.status; worstName = name; }
              });
              if (worst === null) setDot(door, 'unknown', 'No word from Kuma yet');
              else if (worst === 1) setDot(door, 'up', DOORS[door].join(' + ') + ' — up');
              else setDot(door, CLS[worst], worstName + ' — ' + (worst === 0 ? 'DOWN' : worst === 2 ? 'pending' : 'maintenance'));
            });
          });
        }).catch(function () {
          setDot('status', 'down', 'Uptime Kuma is unreachable');
          Object.keys(DOORS).forEach(function (door) { setDot(door, 'unknown', 'Status unknown — Kuma unreachable'); });
        });
      }
      lights(); setInterval(lights, 30000);

      function fmtBytes(b) { return (b / 1e9).toFixed(1) + ' GB'; }
      function ago(iso) {
        var t = new Date(iso).getTime(); if (!t) return '';
        var m = Math.max(0, Math.round((Date.now() - t) / 60000));
        if (m < 2) return 'just now';
        if (m < 60) return m + ' min ago';
        var h = Math.floor(m / 60);
        if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
        var d = Math.floor(h / 24);
        return d + (d === 1 ? ' day ago' : ' days ago');
      }
      function estate() {
        fetch('/estate.json').then(function (r) { return r.json(); }).then(function (e) {
          var v = e.vitals || {};
          document.getElementById('v-load').textContent = (v.load1 != null ? Number(v.load1).toFixed(2) : '–');
          document.getElementById('v-mem').textContent = (v.mem_pct != null ? v.mem_pct + '%' : '–');
          document.getElementById('v-lib').textContent = (v.disk_library != null ? v.disk_library + '%' : '–');
          document.getElementById('v-vault').textContent = (v.disk_vault != null ? v.disk_vault + '%' : '–');
          var chk = e.checks || {}, names = Object.keys(chk);
          var bad = names.filter(function (n) { return chk[n] !== 'OK'; });
          var cv = document.getElementById('v-checks');
          cv.textContent = (names.length - bad.length) + '/' + names.length;
          cv.style.color = bad.length ? '#e5534b' : '';
          document.getElementById('v-updated').textContent = 'updated ' + ago(e.updated);
          document.getElementById('strip').style.display = '';
          var im = e.immich || {};
          if (im.photos != null) {
            document.getElementById('photos-count').textContent =
              im.photos.toLocaleString() + ' photos · ' + im.videos.toLocaleString() + ' videos · ' + fmtBytes(im.usage);
          }
          var vt = e.vault || {};
          if (vt.latest) {
            document.getElementById('vault-line').textContent = 'Last backup ' + ago(vt.latest);
            document.getElementById('vault-sub').textContent = vt.snapshots + ' snapshots kept · nightly 03:00';
          }
          var feed = document.getElementById('feed');
          var evs = (e.events || []).slice().reverse();
          if (bad.length) evs.unshift({ time: e.updated, text: 'Failing now: ' + bad.join(', '), bad: true });
          if (!evs.length) {
            feed.textContent = 'All quiet — the estate has nothing to report.';
          } else {
            feed.innerHTML = '';
            evs.forEach(function (ev) {
              var row = document.createElement('div');
              var when = document.createElement('span');
              when.className = 'when'; when.textContent = ago(ev.time);
              row.appendChild(when);
              var tx = document.createElement('span');
              if (ev.bad) tx.className = 'bad';
              tx.textContent = ev.text;
              row.appendChild(tx);
              feed.appendChild(row);
            });
          }
        }).catch(function () { /* estate.json not wired yet — strip stays hidden */ });
      }
      estate(); setInterval(estate, 60000);
    </script>
    </body>
    </html>
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /estate.json {
            alias /usr/share/nginx/estate/estate.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        location /kuma-api/ {
            proxy_pass http://uptime-kuma.uptime-kuma.svc.cluster.local:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
